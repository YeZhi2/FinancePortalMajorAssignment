<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>产品中心 · 汇金财富</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="section-head">
        <h2>产品中心</h2>
        <span class="hint" id="result-hint">共 0 款产品</span>
    </div>

    <form class="filter-bar" id="filter-form">
        <div class="form-row">
            <label for="keyword">关键字</label>
            <input class="input" id="keyword" name="keyword" placeholder="产品名称或代码">
        </div>
        <div class="form-row">
            <label for="category">产品类型</label>
            <select class="input" id="category" name="category">
                <option value="">全部</option>
                <option value="货币型">货币型</option>
                <option value="债券型">债券型</option>
                <option value="混合型">混合型</option>
                <option value="指数型">指数型</option>
                <option value="股票型">股票型</option>
            </select>
        </div>
        <div class="form-row">
            <label for="riskLevel">风险等级</label>
            <select class="input" id="riskLevel" name="riskLevel">
                <option value="">全部</option>
                <option value="R1">R1 低风险</option>
                <option value="R2">R2 中低风险</option>
                <option value="R3">R3 中风险</option>
                <option value="R4">R4 中高风险</option>
                <option value="R5">R5 高风险</option>
            </select>
        </div>
        <div class="form-row">
            <label for="sort">排序</label>
            <select class="input" id="sort" name="sort">
                <option value="">默认</option>
                <option value="return_desc">收益率从高到低</option>
                <option value="term_asc">期限从短到长</option>
                <option value="min_asc">起投金额从低到高</option>
            </select>
        </div>
        <div class="form-row">
            <button class="btn" type="submit">筛选</button>
        </div>
    </form>

    <section class="comparison-bar" aria-labelledby="comparison-title">
        <div>
            <strong id="comparison-title">产品对比</strong>
            <p class="hint" id="comparison-count" aria-live="polite" tabindex="-1">已选 0 / 3 款；请选择 2–3 款</p>
        </div>
        <div class="comparison-picks" id="comparison-picks"></div>
        <div class="comparison-actions">
            <button class="btn btn-sm btn-outline" type="button" id="comparison-clear" disabled>清空</button>
            <button class="btn btn-sm" type="button" id="comparison-open" disabled>开始对比</button>
        </div>
    </section>

    <div class="grid grid-3" id="product-list" style="margin-top:20px">
        <div class="empty">加载中…</div>
    </div>

    <div class="pagination" id="pagination"></div>

    <dialog class="comparison-dialog" id="comparison-dialog" aria-labelledby="comparison-dialog-title">
        <div class="comparison-dialog-head">
            <h2 id="comparison-dialog-title">理财产品对比</h2>
            <form method="dialog"><button class="btn btn-sm btn-outline" type="submit" autofocus>关闭</button></form>
        </div>
        <p class="hint">预期年化收益率不代表实际收益。对比不替代风险测评，不构成购买建议。</p>
        <p class="comparison-scroll-hint">左右滑动查看全部产品</p>
        <div class="table-wrap comparison-table" id="comparison-table" tabindex="0" role="region" aria-label="产品对比表"></div>
    </dialog>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/product-comparison.js"></script>
<script>
    const state = { page: 1, size: 9, keyword: '', category: '', riskLevel: '', sort: '' };
    const comparison = initProductComparison();

    function buildQuery() {
        const params = new URLSearchParams();
        params.set('page', state.page);
        params.set('size', state.size);
        if (state.keyword) params.set('keyword', state.keyword);
        if (state.category) params.set('category', state.category);
        if (state.riskLevel) params.set('riskLevel', state.riskLevel);
        if (state.sort) params.set('sort', state.sort);
        return params.toString();
    }

    async function loadProducts() {
        const listBox = document.getElementById('product-list');
        listBox.innerHTML = '<div class="empty">加载中…</div>';
        try {
            const result = await API.get('/api/products?' + buildQuery());
            document.getElementById('result-hint').textContent = '共 ' + result.total + ' 款产品';
            comparison.setVisibleProducts(result.list);
            listBox.innerHTML = result.list.length
                ? result.list.map(product => UI.productCard(product, comparison.isSelected(product.id))).join('')
                : UI.empty('没有符合条件的产品，试试放宽筛选条件');
            renderPagination(result);
        } catch (error) {
            UI.handleError(error);
        }
    }

    function renderPagination(result) {
        const box = document.getElementById('pagination');
        if (result.pages <= 1) {
            box.innerHTML = '';
            return;
        }
        let html = `<button type="button" data-page="${result.page - 1}" ${result.page <= 1 ? 'disabled' : ''}>上一页</button>`;
        for (let i = 1; i <= result.pages; i++) {
            html += `<button type="button" data-page="${i}" class="${i === result.page ? 'active' : ''}">${i}</button>`;
        }
        html += `<button type="button" data-page="${result.page + 1}" ${result.page >= result.pages ? 'disabled' : ''}>下一页</button>`;
        box.innerHTML = html;
    }

    document.getElementById('pagination').addEventListener('click', event => {
        const target = event.target.closest('button[data-page]');
        if (!target || target.disabled) {
            return;
        }
        state.page = Number(target.dataset.page);
        loadProducts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('filter-form').addEventListener('submit', event => {
        event.preventDefault();
        state.keyword = document.getElementById('keyword').value.trim();
        state.category = document.getElementById('category').value;
        state.riskLevel = document.getElementById('riskLevel').value;
        state.sort = document.getElementById('sort').value;
        state.page = 1;
        loadProducts();
    });

    (async function () {
        await initLayout('products');
        loadProducts();
    })();
</script>
</body>
</html>
