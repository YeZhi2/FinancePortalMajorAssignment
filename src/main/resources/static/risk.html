<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>风险测评 · 汇金财富</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="section-head">
        <h2>风险承受能力测评</h2>
        <span class="hint">共 10 题，约需 2 分钟</span>
    </div>

    <div id="risk-root">
        <div class="empty">加载中…</div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
    const QUESTIONS = [
        {
            title: '1. 您的年龄区间是？',
            options: ['60 岁以上', '51-60 岁', '41-50 岁', '31-40 岁', '18-30 岁']
        },
        {
            title: '2. 您的家庭年收入大约是？',
            options: ['10 万元以下', '10-30 万元', '30-50 万元', '50-100 万元', '100 万元以上']
        },
        {
            title: '3. 您可用于投资的资金占家庭总资产的比例？',
            options: ['10% 以下', '10%-30%', '30%-50%', '50%-70%', '70% 以上']
        },
        {
            title: '4. 您计划的最短投资期限是？',
            options: ['3 个月以内', '3-6 个月', '6-12 个月', '1-3 年', '3 年以上']
        },
        {
            title: '5. 您过去的投资经验主要是？',
            options: ['只有银行存款', '货币基金、国债', '债券基金、银行理财', '混合基金、可转债', '股票、期货等']
        },
        {
            title: '6. 如果持有的产品出现 10% 的亏损，您会？',
            options: ['立即全部赎回', '赎回大部分', '观望一段时间', '继续持有', '加仓摊低成本']
        },
        {
            title: '7. 您能接受的最大本金亏损幅度是？',
            options: ['不能接受任何亏损', '5% 以内', '5%-15%', '15%-30%', '30% 以上']
        },
        {
            title: '8. 您更看重理财产品的哪一点？',
            options: ['本金安全', '收益稳定', '收益与风险平衡', '较高收益', '追求高收益']
        },
        {
            title: '9. 您当前收入的稳定性如何？',
            options: ['不稳定', '较不稳定', '一般', '较稳定', '非常稳定']
        },
        {
            title: '10. 面对市场大幅波动，您的感受是？',
            options: ['非常焦虑', '比较担心', '有些在意但能承受', '比较平静', '完全不受影响']
        }
    ];

    function renderQuestions() {
        const list = QUESTIONS.map((question, qIndex) => `
            <section class="question">
                <h3>${question.title}</h3>
                <div class="options">
                    ${question.options.map((option, oIndex) => `
                        <label>
                            <input type="radio" name="q${qIndex}" value="${oIndex}" data-q="${qIndex}">
                            <span>${option}</span>
                        </label>`).join('')}
                </div>
            </section>`).join('');

        document.getElementById('risk-root').innerHTML = `
            <div class="card" style="margin-bottom:20px">
                <div class="card-title">测评说明</div>
                <p style="color:var(--text-soft);margin:0">
                    测评结果用于判断您可购买的产品风险范围：C1 保守型只能购买 R1 产品，C5 进取型可购买 R1~R5 全部产品。
                    测评可重复进行，系统以最近一次结果为准。
                </p>
            </div>
            <form id="risk-form">
                ${list}
                <p class="error-text" id="risk-error"></p>
                <div class="form-actions">
                    <button class="btn btn-accent" type="submit" id="risk-submit">提交测评</button>
                </div>
            </form>`;

        document.querySelectorAll('.options label').forEach(label => {
            const input = label.querySelector('input');
            input.addEventListener('change', () => {
                document.querySelectorAll(`label input[data-q="${input.dataset.q}"]`).forEach(other => {
                    other.closest('label').classList.toggle('checked', other.checked);
                });
            });
        });

        document.getElementById('risk-form').addEventListener('submit', submitAssessment);
    }

    function renderResult(result) {
        document.getElementById('risk-root').innerHTML = `
            <div class="result-card">
                <div class="score">${result.score}<small style="font-size:16px;color:rgba(255,255,255,.6)"> / 40 分</small></div>
                <div class="level">${result.riskLevel} · ${result.customerLabel}</div>
                <p>${result.description}</p>
                <div class="hero-actions" style="margin-top:18px">
                    <a class="btn btn-accent" href="products.html">去找匹配的产品</a>
                    <button class="btn btn-ghost" type="button" id="retake">重新测评</button>
                </div>
            </div>
            <div class="card" style="margin-top:20px">
                <div class="card-title">您的可购买范围</div>
                <p style="margin:0;color:var(--text-soft)">
                    当前等级 <strong>${result.riskLevel}</strong>，可购买风险等级不高于该等级的产品；更高风险等级的产品会被系统拦截。
                </p>
            </div>`;
        document.getElementById('retake').addEventListener('click', renderQuestions);
    }

    async function submitAssessment(event) {
        event.preventDefault();
        const errorBox = document.getElementById('risk-error');
        errorBox.textContent = '';
        const answers = [];
        for (let i = 0; i < QUESTIONS.length; i++) {
            const checked = document.querySelector(`input[name="q${i}"]:checked`);
            if (!checked) {
                errorBox.textContent = `请完成第 ${i + 1} 题`;
                return;
            }
            answers.push(Number(checked.value));
        }
        const button = document.getElementById('risk-submit');
        button.disabled = true;
        try {
            const result = await API.post('/api/risk/assessments', { answers });
            UI.toast('测评完成：' + result.riskLevel + ' ' + result.customerLabel, 'success');
            renderResult(result);
        } catch (error) {
            if (error.status === 401) {
                location.href = UI.loginUrl();
                return;
            }
            errorBox.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    }

    async function loadLatest() {
        try {
            const latest = await API.get('/api/risk/latest');
            if (latest && latest.assessed) {
                const box = document.createElement('div');
                box.className = 'card';
                box.style.marginBottom = '20px';
                box.innerHTML = `
                    <div class="card-title">您当前的测评结论</div>
                    <p style="margin:0;color:var(--text-soft)">
                        <span class="badge badge-accent">${latest.riskLevel} ${latest.customerLabel}</span>
                        得分 ${latest.score} / 40，测评时间 ${UI.datetime(latest.createdAt)}。
                        如需调整可重新测评，系统以最新结果为准。
                    </p>`;
                document.getElementById('risk-root').prepend(box);
            }
        } catch (error) {
            // 未测评或未登录时不展示历史结论
        }
    }

    (async function () {
        const me = await initLayout('risk');
        if (!me) {
            document.getElementById('risk-root').innerHTML = `
                <div class="card" style="text-align:center;padding:40px">
                    <h3>请先登录后再进行风险测评</h3>
                    <p style="color:var(--muted)">测评结果会保存到您的账户，用于匹配可购买的产品范围。</p>
                    <a class="btn btn-accent" href="login.html?redirect=risk.html">去登录</a>
                </div>`;
            return;
        }
        renderQuestions();
        await loadLatest();
    })();
</script>
</body>
</html>
